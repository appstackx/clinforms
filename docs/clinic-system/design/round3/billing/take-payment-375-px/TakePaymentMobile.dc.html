<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Take payment – mobile</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
:focus-visible{outline:2px solid #0E958A;outline-offset:2px}
</style>
</helmet>
<div style="width: 375px; height: 812px; background: #FFFFFF; color: #0F172A; font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 22px; display: flex; flex-direction: column; overflow: hidden">
<header style="border-bottom: 1px solid #E2E8F0; padding: 6px 8px; display: flex; align-items: center; gap: 4px; min-height: 56px">
<button type="button" onClick="{{reset}}" aria-label="Close" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
<div style="flex: 1; display: flex; flex-direction: column; line-height: 18px"><h1 style="margin: 0; font-size: 17px; font-weight: 600">Take payment</h1><span style="font-size: 13px; color: #475569">Owen Price · £120.00 owing</span></div>
</header>
<sc-if value="{{isForm}}" hint-placeholder-val="{{true}}">
<div style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px">
<div role="group" aria-label="Amount" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #F1F5F9; border-radius: 10px; padding: 4px; gap: 4px">
<button type="button" aria-pressed="{{fullStr}}" onClick="{{pickFull}}" style="height: 44px; border: 0; border-radius: 8px; background: {{fullBg}}; font: inherit; font-weight: 600">Full £120.00</button>
<button type="button" aria-pressed="{{partStr}}" onClick="{{pickPart}}" style="height: 44px; border: 0; border-radius: 8px; background: {{partBg}}; font: inherit; font-weight: 600">Part</button>
</div>
<sc-if value="{{isPart}}" hint-placeholder-val="{{false}}"><div style="display: flex; flex-direction: column; gap: 4px"><label for="pa" style="font-weight: 500">Amount</label><input id="pa" type="text" inputmode="decimal" value="£65.00" style="height: 52px; padding: 0 12px; border: 1px solid #CBD5E1; border-radius: 10px; font: inherit; font-size: 20px; font-weight: 600"><span style="font-size: 13px; color: #475569">Pays INV-04821 (DNA fee) in full</span></div></sc-if>
<fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px"><legend style="font-weight: 600; padding: 0; margin-bottom: 8px">Method</legend>
<sc-for list="{{methods}}" as="m" hint-placeholder-count="4"><label style="display: flex; gap: 12px; align-items: center; min-height: 56px; padding: 0 14px; border-radius: 12px; border: 1px solid {{m.bd}}; background: {{m.bg}}"><input type="radio" name="mm" checked="{{m.on}}" onChange="{{m.pick}}" style="width: 20px; height: 20px; margin: 0; accent-color: #0B7970"><span style="display: flex; flex-direction: column; line-height: 18px"><strong>{{m.name}}</strong><span style="font-size: 13px; color: #475569">{{m.desc}}</span></span></label></sc-for>
</fieldset>
<label style="display: flex; gap: 10px; align-items: center; min-height: 44px"><input type="checkbox" checked="checked" style="width: 20px; height: 20px; margin: 0; accent-color: #0B7970">Email receipt to owen.price@example.com</label>
</div>
<div style="border-top: 1px solid #E2E8F0; padding: 12px 16px 16px"><button type="button" onClick="{{take}}" style="width: 100%; height: 52px; border-radius: 12px; border: 0; background: #0B7970; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600">{{cta}}</button></div>
</sc-if>
<sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
<div role="status" style="flex: 1; padding: 40px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px">
<span style="width: 56px; height: 56px; border-radius: 999px; background: #DCFCE7; color: #166534; display: inline-flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg></span>
<strong style="font-size: 20px">{{doneTitle}}</strong>
<span style="color: #475569">Receipt RCT-20931 emailed. Balance now £{{after}}.</span>
<button type="button" onClick="{{reset}}" style="margin-top: 12px; width: 100%; height: 52px; border-radius: 12px; border: 0; background: #0B7970; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600">Done</button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { full: true, method: 'onfile', done: false }; }
  renderVals() {
    const st = this.state;
    const M = [['onfile', 'Card on file', 'Card ending 1111'], ['link', 'Payment link', 'By text and email'], ['cash', 'Cash', 'Change worked out for you'], ['bank', 'Bank transfer', 'Record a reference']];
    const amt = st.full ? 120 : 65;
    return {
      isForm: !st.done, isDone: st.done, isPart: !st.full,
      fullStr: st.full ? 'true' : 'false', partStr: st.full ? 'false' : 'true', fullBg: st.full ? '#FFFFFF' : 'transparent', partBg: st.full ? 'transparent' : '#FFFFFF',
      pickFull: () => this.setState({ full: true }), pickPart: () => this.setState({ full: false }),
      methods: M.map(([k, name, desc]) => ({ name, desc, on: st.method === k, bg: st.method === k ? '#F0FDFA' : '#FFFFFF', bd: st.method === k ? '#0E958A' : '#E2E8F0', pick: () => this.setState({ method: k }) })),
      cta: st.method === 'link' ? 'Send link for £' + amt.toFixed(2) : 'Take £' + amt.toFixed(2),
      take: () => this.setState({ done: true }),
      doneTitle: st.method === 'link' ? 'Payment link sent' : '£' + amt.toFixed(2) + ' taken',
      after: st.method === 'link' ? '120.00' : (120 - amt).toFixed(2),
      reset: () => this.setState({ done: false, full: true, method: 'onfile' })
    };
  }
}
</script>
</body>
</html>
