<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Questionnaire – patient</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
:focus-visible{outline:2px solid #0E958A;outline-offset:2px}
label:has(input:focus-visible){outline:2px solid #0E958A;outline-offset:2px}
</style>
</helmet>
<div style="width: 375px; height: 812px; background: #F8FAFC; color: #0F172A; font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 22px; display: flex; flex-direction: column; overflow: hidden">
<header style="background: #FFFFFF; border-bottom: 1px solid #E2E8F0; padding: 6px 8px 10px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 4px; min-height: 44px">
<button type="button" onClick="{{back}}" aria-label="Previous question" disabled="{{atStart}}" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: {{backFg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<div style="flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 8px; background: #0B7970; color: #FFFFFF; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: none">NP</span><span style="font-weight: 600; font-size: 14px">Back pain questionnaire</span></div>
</div>
<sc-if value="{{asking}}" hint-placeholder-val="{{true}}"><div style="padding: 0 8px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #475569">Question {{qn}} of 10 · about 3 minutes</span><div role="progressbar" aria-label="Progress" aria-valuemin="1" aria-valuemax="10" aria-valuenow="{{qn}}" style="height: 4px; border-radius: 4px; background: #E2E8F0; overflow: hidden"><div style="height: 100%; width: {{pct}}; background: #0E958A"></div></div></div></sc-if>
</header>
<sc-if value="{{asking}}" hint-placeholder-val="{{true}}">
<main style="flex: 1; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px">
<fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 20px; line-height: 28px; font-weight: 600; padding: 0; margin-bottom: 4px">{{q.title}}</legend>
<p style="margin: 0 0 6px; color: #475569; font-size: 14px">{{q.ask}}</p>
<sc-for list="{{opts}}" as="o" hint-placeholder-count="6"><label style="display: flex; gap: 12px; align-items: center; min-height: 52px; padding: 8px 14px; border-radius: 12px; border: 1px solid {{o.bd}}; background: {{o.bg}}; cursor: pointer"><input type="radio" name="q" checked="{{o.on}}" onChange="{{o.pick}}" style="width: 20px; height: 20px; margin: 0; accent-color: #0B7970; flex: none"><span>{{o.text}}</span></label></sc-for>
</fieldset>
<sc-if value="{{q.optional}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{skip}}" style="height: 44px; border: 0; background: transparent; color: #0B7970; font: inherit; font-weight: 500; text-decoration: underline">Prefer not to answer</button></sc-if>
</main>
<footer style="background: #FFFFFF; border-top: 1px solid #E2E8F0; padding: 12px 16px 16px"><button type="button" onClick="{{next}}" disabled="{{noAnswer}}" style="width: 100%; height: 52px; border-radius: 12px; border: 0; background: {{ctaBg}}; color: {{ctaFg}}; font: inherit; font-size: 16px; font-weight: 600">{{cta}}</button></footer>
</sc-if>
<sc-if value="{{finished}}" hint-placeholder-val="{{false}}">
<main role="status" style="flex: 1; padding: 40px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px">
<span style="width: 56px; height: 56px; border-radius: 999px; background: #DCFCE7; color: #166534; display: inline-flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg></span>
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600">Thank you, Ravi</h1>
<p style="margin: 0; color: #475569">Your answers have gone to Priya Shah for your appointment on Wed 28/10 at 08:00. Your score so far: <strong style="color: #0F172A">{{score}}%</strong> – Priya will talk it through with you.</p>
<a href="Portal.dc.html" style="margin-top: 12px; width: 100%; height: 52px; border-radius: 12px; background: #0B7970; color: #FFFFFF; text-decoration: none; font-weight: 600; display: flex; align-items: center; justify-content: center">Back to my appointments</a>
</main>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { i: 2, a: { 0: 2, 1: 1 }, done: false }; }
  renderVals() {
    const st = this.state;
    const Q = [['Pain', 'How bad is your back pain at the moment?'], ['Looking after yourself', 'Washing and dressing'], ['Lifting', 'Lifting things from the floor or a table'], ['Walking', 'How far you can walk'], ['Sitting', 'How long you can sit'], ['Standing', 'How long you can stand'], ['Sleeping', 'Does pain disturb your sleep?'], ['Sex life', 'Optional – you can skip this one', true], ['Social life', 'Going out and seeing people'], ['Travelling', 'Car, bus or train journeys']];
    const O = ['No problem', 'A little difficult', 'Quite difficult', 'Very difficult', 'I need a lot of help', 'I can’t do this at all'];
    const q = Q[st.i];
    const opts = O.map((text, v) => { const on = st.a[st.i] === v; return { text, on, bg: on ? '#F0FDFA' : '#FFFFFF', bd: on ? '#0E958A' : '#E2E8F0', pick: () => { const a = Object.assign({}, st.a); a[st.i] = v; this.setState({ a }); } }; });
    const vals = Object.keys(st.a).map(k => st.a[k]); const score = vals.length ? Math.round(vals.reduce((s, v) => s + v, 0) / (5 * vals.length) * 100) : 0;
    const answered = st.a[st.i] != null; const last = st.i === 9;
    const go = () => last ? this.setState({ done: true }) : this.setState({ i: st.i + 1 });
    return {
      asking: !st.done, finished: st.done, qn: st.i + 1, pct: ((st.i + 1) * 10) + '%',
      q: { title: q[0], ask: q[1], optional: !!q[2] }, opts, score,
      atStart: st.i === 0, backFg: st.i === 0 ? '#CBD5E1' : '#0F172A', back: () => { if (st.i > 0) this.setState({ i: st.i - 1, done: false }); },
      noAnswer: !answered, ctaBg: answered ? '#0B7970' : '#E2E8F0', ctaFg: answered ? '#FFFFFF' : '#64748B',
      cta: last ? 'Send to my physio' : 'Next', next: () => { if (answered) go(); }, skip: go
    };
  }
}
</script>
</body>
</html>
