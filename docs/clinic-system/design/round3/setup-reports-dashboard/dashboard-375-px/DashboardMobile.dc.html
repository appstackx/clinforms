<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Dashboard – mobile</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#0B7970}
:focus-visible{outline:2px solid #0E958A;outline-offset:2px}
</style>
</helmet>
<div style="width: 375px; height: 812px; background: #F8FAFC; color: #0F172A; font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 14px; line-height: 20px; display: flex; flex-direction: column; overflow: hidden">
<header style="background: #FFFFFF; border-bottom: 1px solid #E2E8F0; padding: 8px 8px 8px 4px; display: flex; align-items: center; gap: 4px">
<button type="button" aria-label="Open menu" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: #0F172A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
<div style="flex: 1; display: flex; flex-direction: column; line-height: 18px"><h1 style="margin: 0; font-size: 17px; font-weight: 600">Today</h1><span style="font-size: 12px; color: #475569">Wed 28/10 · {{site}}</span></div>
<button type="button" aria-label="Search patients" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM21 21l-4.3-4.3"></path></svg></button>
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: {{u.avBg}}; color: {{u.avFg}}; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px; margin-right: 4px">{{u.init}}</span>
</header>
<div style="flex: 1; overflow-y: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="4"><a href="{{k.href}}" style="min-height: 76px; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 14px; padding: 10px 12px; text-decoration: none; color: #0F172A; display: flex; flex-direction: column"><span style="font-size: 12px; color: #475569">{{k.label}}</span><strong style="font-size: 22px; line-height: 30px; font-variant-numeric: tabular-nums; color: {{k.fg}}">{{k.value}}</strong><span style="font-size: 12px; color: #475569">{{k.sub}}</span></a></sc-for>
</div>
<sc-for list="{{cards}}" as="c" hint-placeholder-count="2">
<section aria-label="{{c.title}}" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 14px">
<div style="padding: 12px 14px 6px; display: flex; align-items: center"><h2 style="margin: 0; font-size: 15px; font-weight: 600; flex: 1">{{c.title}}</h2><a href="{{c.href}}" style="font-size: 13px; font-weight: 500; min-height: 32px; display: inline-flex; align-items: center">All</a></div>
<ul style="list-style: none; margin: 0; padding: 0 0 4px">
<sc-for list="{{c.items}}" as="i" hint-placeholder-count="3">
<li><a href="{{i.href}}" style="display: flex; gap: 10px; align-items: center; padding: 10px 14px; min-height: 56px; border-top: 1px solid #F1F5F9; text-decoration: none; color: #0F172A">
<sc-if value="{{i.hasLead}}" hint-placeholder-val="{{true}}"><strong style="width: 44px; font-variant-numeric: tabular-nums">{{i.lead}}</strong></sc-if>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><strong style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{i.primary}}</strong><span style="font-size: 12px; color: #475569; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{i.secondary}}</span></span>
<span style="display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px 0 6px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: {{i.bg}}; color: {{i.fg}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"></path></svg>{{i.label}}</span>
</a></li>
</sc-for>
</ul>
</section>
</sc-for>
</div>
<nav aria-label="Main" style="background: #FFFFFF; border-top: 1px solid #E2E8F0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 4px 4px 8px">
<a href="DashboardMobile.dc.html" aria-current="page" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #0B7970; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 22V12h6v10"></path></svg>Today</a>
<a href="DiaryMobile.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #475569; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>Diary</a>
<a href="PatientMobile.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #475569; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg>Patients</a>
<a href="Messages.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #475569; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>Messages</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["clinician","reception","owner"],"default":"clinician"},"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  renderVals() {
    const role = this.props.role ?? 'clinician';
    const I = { cal: 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z', uc: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM16 11l2 2 4-4', act: 'M22 12h-4l-3 9L9 3l-3 9H2', clock: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 6v6l4 2', al: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 8v4M12 16h.01', x: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM15 9l-6 6M9 9l6 6', msg: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z' };
    const S = { booked: ['#E8EEFB', '#1842B4', I.cal, 'Booked'], arrived: ['#FEF3C7', '#864E0E', I.uc, 'Arrived'], treat: ['#D5F5F0', '#0B5F58', I.act, 'In treatment'], unsigned: ['#FEF3C7', '#864E0E', I.clock, 'Unsigned'], over: ['#FEE2E2', '#991B1B', I.al, 'Over 24 h'], failed: ['#FEE2E2', '#991B1B', I.x, 'Failed'], low: ['#FEF3C7', '#864E0E', I.al, '1 left'], new: ['#E8EEFB', '#1842B4', I.msg, 'New'] };
    const i = (lead, primary, secondary, s, href) => ({ lead, hasLead: !!lead, primary, secondary, href: href || 'PatientMobile.dc.html', bg: S[s][0], fg: S[s][1], icon: S[s][2], label: S[s][3] });
    const k = (label, value, sub, href, warn) => ({ label, value, sub, href, fg: warn ? '#BA1C1C' : '#0F172A' });
    const D = {
      clinician: { kpis: [k('My appointments', '9', '4 done', 'DiaryMobile.dc.html'), k('Unsigned notes', '3', 'Oldest Mon', 'NoteEditor.dc.html', true), k('Measures due', '4', 'Today', 'Outcome.dc.html'), k('Open cases', '64', '2 sites', 'PatientMobile.dc.html')],
        cards: [{ title: 'My next patients', href: 'DiaryMobile.dc.html', items: [i('10:30', 'Chloe Bennett', 'Follow-up · Room 1', 'treat'), i('11:00', 'Emily Turner', 'Initial · latex allergy', 'arrived'), i('15:00', 'George Lewis', 'Follow-up · NPRS + PSFS due', 'booked')] },
          { title: 'Unsigned notes', href: 'NoteEditor.dc.html', items: [i('', 'Margaret Ellis', 'SOAP initial · Mon 26/10', 'over', 'NoteEditor.dc.html'), i('', 'Ravi Patel', 'SOAP follow-up · today 08:00', 'unsigned', 'NoteEditor.dc.html')] }] },
      reception: { kpis: [k('Appointments', '41', '12 done', 'DiaryMobile.dc.html'), k('To arrive', '29', 'Next 11:15', 'DiaryMobile.dc.html'), k('Invoices to raise', '6', 'Attended', 'InvoiceVisits.dc.html'), k('Replies', '4', 'Oldest 09:52', 'Messages.dc.html')],
        cards: [{ title: 'Arrivals', href: 'DiaryMobile.dc.html', items: [i('11:00', 'Emily Turner', 'Initial · Priya Shah', 'arrived'), i('11:15', 'Mohammed Iqbal', 'Follow-up · Aisha Rahman', 'booked'), i('11:30', 'Noah Bradley', 'Follow-up · Tom Hughes', 'booked')] },
          { title: 'Replies to answer', href: 'Messages.dc.html', items: [i('10:14', 'Margaret Ellis', 'Is there parking?', 'new', 'Messages.dc.html'), i('09:52', 'Grace Kim', 'Can I move to later?', 'new', 'Messages.dc.html')] }] },
      owner: { kpis: [k('Appointments', '386', '5 sites', 'DiaryMobile.dc.html'), k('Utilisation', '82%', 'Target 80%', 'Reports.dc.html'), k('Taken today', '£6,240', 'All methods', 'BillingList.dc.html'), k('Overdue', '£4,600', '37 invoices', 'BillingList.dc.html', true)],
        cards: [{ title: 'Failed messages', href: 'Messages.dc.html', items: [i('', 'Lucy Fraser', 'Reminder text · unreachable', 'failed', 'Messages.dc.html'), i('', 'Paul Rowe', 'Reminder text · landline', 'failed', 'Messages.dc.html')] },
          { title: 'Authorisations ending', href: 'Reports.dc.html', items: [i('', 'Liam O’Connor', 'Bluewell Health (fictional) · 5 of 6', 'low'), i('', 'Sarah Quinn', 'Bluewell Health (fictional) · 3 of 4', 'low')] }] }
    };
    const U = { owner: { init: 'HW', avBg: '#EDE9FE', avFg: '#5B21B6' }, clinician: { init: 'PS', avBg: '#CCFBF1', avFg: '#0B5F58' }, reception: { init: 'JT', avBg: '#FEF3C7', avFg: '#864E0E' } };
    return Object.assign({ u: U[role], site: role === 'owner' ? 'My 5 sites' : 'Harbour Road' }, D[role]);
  }
}
</script>
</body>
</html>
