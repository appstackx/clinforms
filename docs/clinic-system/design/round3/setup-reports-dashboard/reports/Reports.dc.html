<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Reports</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#0B7970}a:hover{color:#095E57}
:focus-visible{outline:2px solid #0E958A;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; background: #F8FAFC; color: #0F172A; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 14px; line-height: 20px; display: flex; flex-direction: column">
<header style="background: #FFFFFF; border-bottom: 1px solid #E2E8F0; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 16px; min-height: 56px">
<div style="display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 8px; background: #0B7970; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg></span>
<nav aria-label="Product areas" style="display: flex; background: #F1F5F9; border-radius: 10px; padding: 3px; gap: 2px">
<a href="AppShell.dc.html" aria-current="page" style="height: 30px; padding: 0 12px; border-radius: 8px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(15,23,42,.08); font-weight: 600; color: #0F172A; text-decoration: none; display: inline-flex; align-items: center">{{product}}</a>
<a href="#clinforms" style="height: 30px; padding: 0 12px; border-radius: 8px; font-weight: 500; color: #475569; text-decoration: none; display: inline-flex; align-items: center">ClinForms</a>
</nav>
</div>
<button type="button" style="height: 36px; padding: 0 10px; border: 1px solid #CBD5E1; border-radius: 8px; background: #FFFFFF; font: inherit; font-weight: 500; display: inline-flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B7970" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0zM12 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"></path></svg>All sites (11)<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" style="margin-left: auto; height: 40px; padding: 0 8px 0 4px; border: 0; border-radius: 8px; background: transparent; font: inherit; display: inline-flex; align-items: center; gap: 8px; color: #0F172A">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: #EDE9FE; color: #5B21B6; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">HW</span>
<span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 16px"><span style="font-weight: 600">Helen Ward</span><span style="font-size: 12px; color: #64748B">Owner</span></span>
</button>
</header>

<div style="display: flex; flex-wrap: wrap; flex: 1; align-items: stretch">
<nav aria-label="Reports" style="flex: 1 1 240px; background: #FFFFFF; border-right: 1px solid #E2E8F0; padding: 16px 10px; display: flex; flex-direction: column; gap: 14px">
<a href="AppShell.dc.html" style="font-size: 13px; padding: 0 8px">← Clinic navigation</a>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 600; color: #475569; text-transform: uppercase; letter-spacing: .04em; padding: 0 8px 4px">{{g.label}}</span>
<sc-for list="{{g.items}}" as="r" hint-placeholder-count="2"><button type="button" aria-current="{{r.cur}}" onClick="{{r.pick}}" style="min-height: 36px; padding: 6px 10px; border: 0; border-radius: 8px; background: {{r.bg}}; color: {{r.fg}}; font: inherit; font-weight: {{r.fw}}; text-align: left; cursor: pointer">{{r.label}}</button></sc-for>
</div>
</sc-for>
</nav>

<main style="flex: 999 1 560px; min-width: 0; padding: 20px 24px 32px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-end">
<div style="flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 2px"><h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600">{{r.title}}</h1><span style="color: #475569">{{r.desc}}</span></div>
<button type="button" style="height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #E2E8F0; background: #FFFFFF; font: inherit; font-weight: 500; display: inline-flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>Export CSV</button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; padding: 10px 12px">
<div role="group" aria-label="Date range" style="display: flex; background: #F1F5F9; border-radius: 8px; padding: 3px; gap: 2px">
<sc-for list="{{ranges}}" as="x" hint-placeholder-count="4"><button type="button" aria-pressed="{{x.sel}}" onClick="{{x.pick}}" style="height: 30px; padding: 0 10px; border: 0; border-radius: 6px; background: {{x.bg}}; font: inherit; font-size: 13px; font-weight: 500; color: #0F172A; cursor: pointer; white-space: nowrap">{{x.label}}</button></sc-for>
</div>
<span style="font-size: 13px; color: #475569; font-variant-numeric: tabular-nums">{{rangeText}}</span>
<button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #0E958A; border-radius: 8px; background: #F0FDFA; color: #0B5F58; font: inherit; font-size: 13px; font-weight: 500">Sites: all 11</button>
<button type="button" style="height: 32px; padding: 0 10px; border: 1px dashed #CBD5E1; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 13px">+ Practitioner</button>
<button type="button" style="height: 32px; padding: 0 10px; border: 1px dashed #CBD5E1; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 13px">+ Service</button>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 12px">
<sc-for list="{{r.kpis}}" as="k" hint-placeholder-count="3">
<div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #475569">{{k.label}}</span><strong style="font-size: 22px; line-height: 30px; font-variant-numeric: tabular-nums">{{k.value}}</strong><span style="font-size: 12px; color: #475569">{{k.sub}}</span></div>
</sc-for>
</div>

<figure style="margin: 0; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px">
<figcaption style="font-weight: 600">{{r.chartTitle}}</figcaption>
<svg role="img" aria-label="{{r.aria}}" viewBox="0 0 760 240" style="width: 100%; height: auto">
<line x1="48" y1="200" x2="750" y2="200" stroke="#CBD5E1"></line>
<line x1="48" y1="140" x2="750" y2="140" stroke="#F1F5F9"></line>
<line x1="48" y1="80" x2="750" y2="80" stroke="#F1F5F9"></line>
<line x1="48" y1="20" x2="750" y2="20" stroke="#F1F5F9"></line>
<text x="40" y="204" text-anchor="end" font-size="11" fill="#64748B">0</text>
<text x="40" y="24" text-anchor="end" font-size="11" fill="#64748B">{{r.max}}</text>
<sc-for list="{{r.bars}}" as="b" hint-placeholder-count="6">
<rect x="{{b.x}}" y="{{b.y}}" width="{{b.w}}" height="{{b.h}}" rx="4" fill="{{b.fill}}"></rect>
<text x="{{b.cx}}" y="{{b.ly}}" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">{{b.label}}</text>
<text x="{{b.cx}}" y="220" text-anchor="middle" font-size="11" fill="#475569">{{b.cat}}</text>
</sc-for>
</svg>
<sc-if value="{{r.hasTarget}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #475569">Darker bar = above the {{r.target}} target.</span></sc-if>
</figure>

<div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; overflow-x: auto">
<table style="width: 100%; border-collapse: collapse; min-width: 640px; font-variant-numeric: tabular-nums">
<thead><tr style="background: #F8FAFC; font-size: 12px; color: #475569"><sc-for list="{{r.cols}}" as="c" hint-placeholder-count="5"><th scope="col" style="padding: 10px 16px; text-align: {{c.align}}; font-weight: 600">{{c.label}}</th></sc-for></tr></thead>
<tbody>
<sc-for list="{{r.rows}}" as="row" hint-placeholder-count="6"><tr style="border-top: 1px solid #E2E8F0"><sc-for list="{{row}}" as="cell" hint-placeholder-count="5"><td style="padding: 10px 16px; text-align: {{cell.align}}; font-weight: {{cell.fw}}">{{cell.v}}</td></sc-for></tr></sc-for>
</tbody>
</table>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { rep: 'attendance', range: 1 }; }
  renderVals() {
    const st = this.state;
    const R = {
      attendance: { title: 'Attendance and DNA', desc: 'How many booked appointments were attended, missed or cancelled late.', chartTitle: 'DNA rate by week (%)',
        cats: ['w/c 21/09', '28/09', '05/10', '12/10', '19/10', '26/10'], vals: [4.1, 3.6, 5.2, 3.1, 2.8, 3.4], fmt: v => v.toFixed(1) + '%', max: 6, target: 4, inverse: true,
        kpis: [['Attended', '2,874', '93.4% of booked'], ['DNA', '108', '3.5% · target under 4%'], ['Late cancellations', '96', '3.1%']],
        cols: ['Week', 'Booked', 'Attended', 'DNA', 'Late cancellation', 'DNA rate'],
        rows: [['w/c 21/09/2026', '512', '476', '21', '15', '4.1%'], ['w/c 28/09/2026', '498', '466', '18', '14', '3.6%'], ['w/c 05/10/2026', '517', '473', '27', '17', '5.2%'], ['w/c 12/10/2026', '520', '489', '16', '15', '3.1%'], ['w/c 19/10/2026', '531', '501', '15', '15', '2.8%'], ['w/c 26/10/2026', '498', '469', '17', '12', '3.4%']] },
      util: { title: 'Utilisation per practitioner', desc: 'Booked time as a share of rota time.', chartTitle: 'Booked share of rota hours (%)',
        cats: ['P Shah', 'T Hughes', 'A Rahman', 'D Murphy', 'S Clarke', 'K Byrne'], vals: [91, 84, 78, 66, 88, 72], fmt: v => v + '%', max: 100, target: 80,
        kpis: [['Average utilisation', '80%', 'Target 80%'], ['Rota hours', '1,236', 'All sites'], ['Unfilled hours', '247', 'Mostly Mon pm, Fri pm']],
        cols: ['Practitioner', 'Rota hours', 'Booked hours', 'Utilisation', 'Main site'],
        rows: [['Priya Shah', '212', '193', '91%', 'Harbour Road'], ['Tom Hughes', '198', '166', '84%', 'Harbour Road'], ['Aisha Rahman', '206', '161', '78%', 'Harbour Road'], ['Dan Murphy', '180', '119', '66%', 'Kingsmead'], ['Sophie Clarke', '220', '194', '88%', 'Elm Park'], ['Kieran Byrne', '220', '158', '72%', 'Castle Street']] },
      caseload: { title: 'Caseload', desc: 'Open cases per practitioner and how they are moving.', chartTitle: 'Open cases',
        cats: ['P Shah', 'T Hughes', 'A Rahman', 'D Murphy', 'S Clarke', 'K Byrne'], vals: [64, 58, 49, 37, 61, 44], fmt: v => String(v), max: 80,
        kpis: [['Open cases', '313', 'All practitioners'], ['New this period', '142', ''], ['Discharged', '118', 'Average 5.4 sessions']],
        cols: ['Practitioner', 'Open', 'New', 'Discharged', 'Avg sessions'],
        rows: [['Priya Shah', '64', '28', '24', '5.1'], ['Tom Hughes', '58', '25', '22', '5.6'], ['Aisha Rahman', '49', '21', '19', '6.2'], ['Dan Murphy', '37', '18', '13', '4.8'], ['Sophie Clarke', '61', '27', '23', '5.3'], ['Kieran Byrne', '44', '23', '17', '5.4']] },
      revenue: { title: 'Revenue', desc: 'Invoiced income by month, patient and insurer combined.', chartTitle: 'Invoiced per month (£k)',
        cats: ['May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'], vals: [148.2, 152.9, 139.4, 121.8, 156.3, 161.0], fmt: v => '£' + v.toFixed(0) + 'k', max: 200,
        kpis: [['Invoiced', '£161,040', 'October to date'], ['Collected', '£142,310', '88% of invoiced'], ['Insurer share', '41%', '£66,026']],
        cols: ['Month', 'Patients', 'Insurers', 'Credit notes', 'Total'],
        rows: [['May 2026', '£86,950', '£61,250', '−£0', '£148,200'], ['Jun 2026', '£90,210', '£62,690', '−£0', '£152,900'], ['Jul 2026', '£82,250', '£57,150', '−£0', '£139,400'], ['Aug 2026', '£71,860', '£49,940', '−£0', '£121,800'], ['Sep 2026', '£92,220', '£64,190', '−£110', '£156,300'], ['Oct 2026', '£95,014', '£66,026', '−£55', '£161,040']] },
      debtors: { title: 'Debtors', desc: 'Money owed by age, all sites.', chartTitle: 'Owed by age (£k)',
        cats: ['Current', '31–60', '61–90', '90+'], vals: [24.6, 7.9, 3.2, 1.4], fmt: v => '£' + v.toFixed(1) + 'k', max: 30,
        kpis: [['Total owed', '£37,100', '1,094 invoices'], ['Over 60 days', '£4,600', '12%'], ['Largest debtor', 'Bluewell Health (fictional)', '£9,820']],
        cols: ['Account', 'Current', '31–60', '61–90', '90+'],
        rows: [['Bluewell Health (fictional)', '£7,140', '£1,980', '£520', '£180'], ['Shieldcare Insurance (fictional)', '£5,210', '£1,470', '£640', '£0'], ['Carter & Lowe Solicitors (fictional)', '£1,250', '£980', '£750', '£500'], ['Patients (all)', '£11,000', '£3,470', '£1,290', '£720']] },
      auth: { title: 'Authorisations', desc: 'Insured cases close to their session limit or expiry.', chartTitle: 'Sessions left on active authorisations',
        cats: ['0 left', '1 left', '2 left', '3 left', '4+ left'], vals: [6, 14, 22, 31, 88], fmt: v => String(v), max: 100,
        kpis: [['Active authorisations', '161', ''], ['Need extension', '20', '0 or 1 session left'], ['Expiring in 14 days', '9', '']],
        cols: ['Patient', 'Insurer', 'Used', 'Authorised', 'Expires'],
        rows: [['Liam O’Connor', 'Bluewell Health (fictional)', '5', '6', '15/12/2026'], ['James Okafor', 'Shieldcare Insurance (fictional)', '6', '6', '02/11/2026'], ['Sarah Quinn', 'Bluewell Health (fictional)', '3', '4', '09/11/2026'], ['Noah Bradley', 'Shieldcare Insurance (fictional)', '7', '8', '30/11/2026']] }
    };
    const groupsDef = [['Appointments', [['attendance', 'Attendance and DNA'], ['util', 'Utilisation']]], ['Clinical', [['caseload', 'Caseload']]], ['Finance', [['revenue', 'Revenue'], ['debtors', 'Debtors'], ['auth', 'Authorisations']]]];
    const groups = groupsDef.map(([label, items]) => ({ label, items: items.map(([k, l]) => ({ label: l, cur: st.rep === k ? 'page' : 'false', bg: st.rep === k ? '#E6F7F5' : 'transparent', fg: st.rep === k ? '#0B5F58' : '#334155', fw: st.rep === k ? 600 : 500, pick: () => this.setState({ rep: k }) })) }));
    const d = R[st.rep];
    const n = d.vals.length; const slot = 700 / n; const bw = Math.min(64, slot * 0.6);
    const bars = d.vals.map((v, i) => {
      const h = Math.max(2, (v / d.max) * 180); const x = 48 + slot * i + (slot - bw) / 2;
      const hit = d.target != null && (d.inverse ? v > d.target : v >= d.target);
      return { x, w: bw, y: 200 - h, h, cx: x + bw / 2, ly: 200 - h - 6, label: d.fmt(v), cat: d.cats[i], fill: d.target != null ? (hit ? '#0B5F58' : '#5EC4B9') : '#0E958A' };
    });
    const align = (i) => i === 0 ? 'left' : 'right';
    const ranges = ['This week', 'Last 6 weeks', 'This quarter', 'Custom'];
    const rangeTexts = ['26/10/2026 – 01/11/2026', '21/09/2026 – 01/11/2026', '01/10/2026 – 31/12/2026', 'Choose dates'];
    return {
      product: 'Clinic system', groups,
      r: { title: d.title, desc: d.desc, chartTitle: d.chartTitle, max: d.fmt(d.max), bars, hasTarget: d.target != null, target: d.fmt(d.target || 0),
        aria: d.chartTitle + ': ' + d.cats.map((c, i) => c + ' ' + d.fmt(d.vals[i])).join(', '),
        kpis: d.kpis.map(k => ({ label: k[0], value: k[1], sub: k[2] })),
        cols: d.cols.map((label, i) => ({ label, align: align(i) })),
        rows: d.rows.map(row => row.map((v, i) => ({ v, align: align(i), fw: i === 0 ? 500 : 400 }))) },
      ranges: ranges.map((label, i) => ({ label, sel: st.range === i ? 'true' : 'false', bg: st.range === i ? '#FFFFFF' : 'transparent', pick: () => this.setState({ range: i }) })),
      rangeText: rangeTexts[st.range]
    };
  }
}
</script>
</body>
</html>
