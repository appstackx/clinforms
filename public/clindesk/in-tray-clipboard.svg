    <use href="#sheetA" xlink:href="#sheetA" fill="#FBF4E8" stroke="none" transform="translate(7 7)"/>
    <use href="#bandA" xlink:href="#bandA" fill="#1F3A6B" stroke="none"/>
    <use href="#sheetA" xlink:href="#sheetA"/>
    <use href="#sheetB" xlink:href="#sheetB" fill="#FBF4E8" stroke="none" transform="translate(7 7)"/>
    <use href="#bandB" xlink:href="#bandB" fill="#33415C" stroke="none"/>
    <use href="#sheetB" xlink:href="#sheetB"/>
    <path stroke-width="4" d="M112 212 H232"/>
    <use href="#trayU" xlink:href="#trayU" fill="#0B6B65" stroke="none" transform="translate(7 7)"/>
