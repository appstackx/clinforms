    <use href="#board" xlink:href="#board"/>
    <use href="#paper" xlink:href="#paper" fill="#FBF4E8"/>
    <use href="#clip" xlink:href="#clip" fill="#0F3B35"/>
    <circle cx="423" cy="96" r="9" fill="#FBF4E8"/>
    <path stroke-width="4" d="M368 170 H476"/>
    <rect x="366" y="196" width="22" height="22" rx="3" stroke-width="4"/>
    <rect x="366" y="234" width="22" height="22" rx="3" stroke-width="4"/>
    <rect x="366" y="272" width="22" height="22" rx="3" stroke-width="4"/>
    <path stroke-width="4" d="M400 207 H474 M400 245 H462 M400 283 H470"/>
    <path stroke="#C4432B" stroke-width="7" d="M368 206 L376 214 L392 192 M368 244 L376 252 L392 230"/>
    <path stroke="#C4432B" stroke-width="5" d="M372 330 C 382 310, 392 310, 392 322 C 392 334, 402 312, 412 318 C 420 324, 428 314, 440 318 H 476"/>
