    <path d="M586 46 V54 M586 118 V126 M546 86 H554 M618 86 H626"/>
    <path stroke-width="8" d="M586 86 L606 104 M586 86 V122"/>
    <circle cx="586" cy="86" r="5" fill="#0F3B35"/>

