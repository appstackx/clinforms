  <!-- solid fills, offset for the print look -->
  <g transform="translate(6 6)">
    <use href="#frame" xlink:href="#frame" fill="#0F3B35"/>
  </g>
  <!-- panes sit inside the solid frame, unshifted -->
  <g fill="#D3E7EF">
    <use href="#p1" xlink:href="#p1"/>
    <use href="#p2" xlink:href="#p2"/>
    <use href="#p3" xlink:href="#p3"/>
    <use href="#p4" xlink:href="#p4"/>
  </g>
  <g transform="translate(6 6)">
    <use href="#blind" xlink:href="#blind" fill="#F6C34A"/>
    <use href="#sill" xlink:href="#sill" fill="#F6C34A"/>
    <use href="#mug" xlink:href="#mug" fill="#C4432B"/>
    <use href="#lf1" xlink:href="#lf1" fill="#0B6B65"/>
    <use href="#lf2" xlink:href="#lf2" fill="#0B6B65"/>
    <use href="#lf3" xlink:href="#lf3" fill="#0B6B65"/>
    <use href="#pot" xlink:href="#pot" fill="#C4432B"/>
    <use href="#clock" xlink:href="#clock" fill="#FBF4E8"/>
    <use href="#col" xlink:href="#col" fill="#0F3B35"/>
    <use href="#foot" xlink:href="#foot" fill="#0F3B35"/>
    <use href="#top" xlink:href="#top" fill="#0B6B65"/>
    <use href="#paper" xlink:href="#paper" fill="#FBF4E8"/>
    <use href="#roll" xlink:href="#roll" fill="#FBF4E8"/>
    <use href="#towel" xlink:href="#towel" fill="#F6C34A"/>
  </g>
