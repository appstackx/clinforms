  <!-- resistance band over the foot of the couch: outlined ribbon -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="#0F3B35" stroke-width="22" d="M612 246 C616 228 664 228 670 252 C674 290 676 332 664 362 C654 384 630 380 634 352 C636 330 642 312 640 290"/>
    <path stroke="#F3A9BA" stroke-width="11" d="M612 246 C616 228 664 228 670 252 C674 290 676 332 664 362 C654 384 630 380 634 352 C636 330 642 312 640 290"/>
