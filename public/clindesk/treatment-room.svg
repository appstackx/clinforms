    <path d="M296 54 V84"/>
    <circle cx="296" cy="90" r="6" fill="#C4432B"/>
    <use href="#frame" xlink:href="#frame"/>
    <path stroke-width="5" d="M84 82 l-8 18 M128 108 l-8 18 M206 84 l-8 18 M254 112 l-8 18 M96 170 l-8 18 M140 196 l-8 16"/>
    <use href="#sill" xlink:href="#sill"/>
    <use href="#mug" xlink:href="#mug"/>
    <path d="M104 204 C124 204 124 226 104 226"/>
    <path stroke-width="4" d="M76 184 C70 174 82 168 76 158 M92 184 C86 174 98 168 92 158"/>
    <use href="#lf1" xlink:href="#lf1"/>
    <use href="#lf2" xlink:href="#lf2"/>
    <use href="#lf3" xlink:href="#lf3"/>
    <use href="#pot" xlink:href="#pot"/>

