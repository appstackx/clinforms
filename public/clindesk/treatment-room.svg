    <rect id="p1" x="52" y="68" width="108" height="76" rx="4"/>
    <rect id="p2" x="180" y="68" width="108" height="76" rx="4"/>
    <rect id="p3" x="52" y="158" width="108" height="66" rx="4"/>
    <rect id="p4" x="180" y="158" width="108" height="66" rx="4"/>
    <rect id="sill" x="12" y="236" width="316" height="22" rx="7"/>
    <rect id="mug" x="62" y="194" width="42" height="42" rx="7"/>
    <path id="pot" d="M218 192 H290 L280 236 H228 Z"/>
    <path id="lf1" d="M252 194 C226 170 222 132 240 110 C264 132 268 168 252 194 Z"/>
    <path id="lf2" d="M256 194 C262 158 288 138 312 142 C308 172 288 190 256 194 Z"/>
